<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="TRUNK(HOTEL) CAT STREET 周辺アクセスマップ（原宿駅・渋谷駅・表参道・キャットストリート・明治通り・青山通り）">
  <!-- 首都高速（装飾・薄め） -->
  <line x1="780" y1="0" x2="900" y2="570" stroke="#2a1f1a" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  <line x1="800" y1="0" x2="912" y2="570" stroke="#2a1f1a" stroke-width="5" stroke-linecap="round" opacity="0.22"/>

  <!-- 明治通り -->
  <polyline points="70,267 370,415 680,484" fill="none" stroke="#2a1f1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 表参道（原宿交差点から青山通りとの交点まで） -->
  <polyline points="145,570 290,298 390,118" fill="none" stroke="#2a1f1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 青山通り（表参道と交差した後も、どちらも途中で切れずにそれぞれ伸びる） -->
  <polyline points="290,0 390,118 500,93 630,192 630,242" fill="none" stroke="#2a1f1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 青山通りから渋谷方面への分岐 -->
  <polyline points="630,242 770,347 900,415" fill="none" stroke="#2a1f1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 青山通りからキャットストリート裏手・渋谷高校方面への分岐 -->
  <polyline points="630,242 580,341 560,434 555,515" fill="none" stroke="#2a1f1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- キャットストリート（会場前の通り: ピンクで強調）。
       表参道/明治通りの交点から、渋谷高校付近の合流点まで、
       折れ曲がりのないシンプルな1本の通り道として結ぶ -->
  <line x1="290" y1="298" x2="580" y2="480" stroke="#e8608a" stroke-width="9" stroke-linecap="round"/>

  <!-- 鉄道 -->
  <line x1="150" y1="515" x2="800" y2="515" stroke="#2a1f1a" stroke-width="4"/>
  <g stroke="#2a1f1a" stroke-width="4">
    <line x1="175" y1="506" x2="175" y2="524"/>
    <line x1="210" y1="506" x2="210" y2="524"/>
    <line x1="245" y1="506" x2="245" y2="524"/>
    <line x1="280" y1="506" x2="280" y2="524"/>
    <line x1="315" y1="506" x2="315" y2="524"/>
    <line x1="350" y1="506" x2="350" y2="524"/>
    <line x1="385" y1="506" x2="385" y2="524"/>
    <line x1="420" y1="506" x2="420" y2="524"/>
    <line x1="455" y1="506" x2="455" y2="524"/>
    <line x1="490" y1="506" x2="490" y2="524"/>
    <line x1="525" y1="506" x2="525" y2="524"/>
    <line x1="560" y1="506" x2="560" y2="524"/>
    <line x1="595" y1="506" x2="595" y2="524"/>
    <line x1="630" y1="506" x2="630" y2="524"/>
    <line x1="665" y1="506" x2="665" y2="524"/>
    <line x1="700" y1="506" x2="700" y2="524"/>
    <line x1="735" y1="506" x2="735" y2="524"/>
    <line x1="770" y1="506" x2="770" y2="524"/>
  </g>

  <!-- 駅ボックス -->
  <rect x="10" y="494" width="140" height="42" fill="#fffdf8" stroke="#2a1f1a" stroke-width="4"/>
  <text x="80" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#2a1f1a">HARAJUKU</text>

  <rect x="800" y="494" width="170" height="42" fill="#fffdf8" stroke="#2a1f1a" stroke-width="4"/>
  <text x="885" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#2a1f1a">SHIBUYA</text>

  <!-- 通り名ラベル・ランドマークは、道路線の真上に乗ると読めなくなるため
       進行方向に対して垂直にオフセットして線から離す。さらに保険として
       白い縁取り(ハロー)を敷き、多少線と近接しても文字を判読できるようにする -->
  <g font-family="Arial, sans-serif" paint-order="stroke" stroke="#fffdf8" stroke-width="5" stroke-linejoin="round">
    <text transform="translate(177,413) rotate(-62)" text-anchor="middle" font-weight="600" font-size="18" fill="#2a1f1a">OMOTESANDO</text>
    <text transform="translate(300,330) rotate(32)" text-anchor="middle" font-weight="600" font-size="18" fill="#c2436b">CAT STREET</text>
    <text transform="translate(495,467) rotate(13)" text-anchor="middle" font-weight="600" font-size="17" fill="#2a1f1a">MEIJI STREET</text>
    <text transform="translate(596,106) rotate(41)" text-anchor="middle" font-weight="600" font-size="17" fill="#2a1f1a">AOYAMA STREET</text>
    <text transform="translate(862,275) rotate(78)" text-anchor="middle" font-weight="600" font-size="13" fill="#2a1f1a" opacity="0.6">SHUTO EXPWY</text>
  </g>

  <!-- 周辺ランドマーク -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#2a1f1a" paint-order="stroke" stroke="#fffdf8" stroke-width="5" stroke-linejoin="round">
    <circle cx="210" cy="353" r="7" fill="#2a1f1a" stroke="none"/>
    <circle cx="210" cy="353" r="3" fill="#fffdf8" stroke="none"/>
    <text x="186" y="340" text-anchor="end">Laforet</text>
    <text x="186" y="358" text-anchor="end">Harajuku</text>

    <circle cx="630" cy="192" r="7" fill="#2a1f1a" stroke="none"/>
    <circle cx="630" cy="192" r="3" fill="#fffdf8" stroke="none"/>
    <text x="654" y="188">Aoyama Gakuin</text>
    <text x="654" y="206">University</text>

    <circle cx="580" cy="384" r="7" fill="#2a1f1a" stroke="none"/>
    <circle cx="580" cy="384" r="3" fill="#fffdf8" stroke="none"/>
    <text x="604" y="380">Streamer Coffee</text>
    <text x="604" y="398">Company</text>

    <circle cx="560" cy="434" r="7" fill="#2a1f1a" stroke="none"/>
    <circle cx="560" cy="434" r="3" fill="#fffdf8" stroke="none"/>
    <text x="584" y="430">Shibuya</text>
    <text x="584" y="448">High School</text>
  </g>

  <!-- 会場キャプション。キャットストリート沿いのだいたいの実際の位置
       （原宿寄りではなく渋谷寄り）に合わせて配置。現在地ピン
       （CSS側 .venue-map-pin）とは道路にもキャプションにも
       被らないよう十分な余白を取る -->
  <rect x="391" y="195" width="190" height="54" fill="#fffdf8" stroke="#e8608a" stroke-width="3"/>
  <text x="486" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#2a1f1a">TRUNK(HOTEL)</text>
  <text x="486" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="1" fill="#c2436b">CAT STREET</text>

  <!-- 方位 -->
  <g transform="translate(42,44)">
    <line x1="0" y1="18" x2="0" y2="-18" stroke="#2a1f1a" stroke-width="4" stroke-linecap="round"/>
    <polygon points="0,-24 -8,-10 8,-10" fill="#2a1f1a"/>
    <text x="0" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#2a1f1a">N</text>
  </g>
</svg>
