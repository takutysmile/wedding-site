AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wedding RSVP - Serverless Stack

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 128
    Timeout: 10
    # 同時実行数を明示的には予約しない。
    # このAWSアカウントはリージョンの同時実行数上限自体が小さいため
    # （AWSの仕様上、予約すると最低100は未予約のまま残す必要があり、
    #  アカウント上限が100未満だと予約自体ができない）、
    # アカウント全体の上限がすでに暴走防止の役割を果たしている。
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref RsvpTable

Parameters:
  AdminPassword:
    Type: String
    NoEcho: true
    Description: 管理画面パスワード（デプロイ時に指定）
  BudgetNotificationEmail:
    Type: String
    Default: i.takuto.volleyball.2@gmail.com
    Description: AWS Budgets（予算アラート）の通知先メールアドレス
  MonthlyBudgetLimitUsd:
    Type: Number
    Default: 10
    Description: 月間予算の上限額（USD）。超過見込み・実際の超過でメール通知する

Resources:

  # ---- DynamoDB ----
  RsvpTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wedding-rsvp
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---- Lambda ----
  RsvpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wedding-rsvp
      CodeUri: src/backend/
      Handler: handler.handler
      Environment:
        Variables:
          ADMIN_PASSWORD: !Ref AdminPassword
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RsvpTable
      Events:
        PostRsvp:
          Type: HttpApi
          Properties:
            Path: /api/rsvp
            Method: POST
            ApiId: !Ref HttpApi
        GetAdminRsvp:
          Type: HttpApi
          Properties:
            Path: /api/admin/rsvp
            Method: GET
            ApiId: !Ref HttpApi
        DeleteAdminRsvp:
          Type: HttpApi
          Properties:
            Path: /api/admin/rsvp/{id}
            Method: DELETE
            ApiId: !Ref HttpApi
        Options:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: OPTIONS
            ApiId: !Ref HttpApi

  # ---- API Gateway (HTTP API) ----
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
      # 全ルート共通のスロットリング。スパム送信・誤ったループ等の
      # リクエスト急増を機械的に抑える（超過分は自動的に429を返す）
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  # ---- S3（フロント配信）----
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wedding-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ---- CloudFront ----
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: wedding-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_200  # 日本（アジア）エッジを含む
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD]
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ---- AWS Budgets（予算アラート）----
  # 「予期せぬ課金」に早く気づくための通知。実費用が80%/100%を
  # 超えたとき、および月内の予測費用が100%を超えそうなときにメール通知する。
  # 費用を自動で止めるものではないため、通知を受けたら手動で対応すること。
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub wedding-site-monthly-budget-${AWS::StackName}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail

Outputs:
  CloudFrontDomain:
    Description: CloudFront ドメイン（config.js の API_BASE に設定する）
    Value: !GetAtt CloudFrontDistribution.DomainName
  ApiEndpoint:
    Description: API Gateway エンドポイント
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FrontendBucketName:
    Description: フロントのS3バケット名
    Value: !Ref FrontendBucket
